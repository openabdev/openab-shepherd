[package]
name = "openab-shepherd"
version = "0.4.0"
edition = "2021"
publish = false
description = "MCP server that exposes terminal panes as tools, over its own native PTY core (loopback only, bearer token)"

[dependencies]
libc = "0.2"
serde_json = "1"
sha2 = { version = "0.10", default-features = false }
tiny_http = "0.12"
vt100 = { version = "=0.18.1", default-features = false }

# Standalone crate: keep cargo from treating a parent directory as its workspace.
[workspace]
